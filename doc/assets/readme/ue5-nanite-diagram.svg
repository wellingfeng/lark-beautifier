<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1180" height="520" fill="url(#bg)"/>
  <rect x="34" y="34" width="1112" height="452" rx="28" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text x="70" y="100" font-size="34" font-weight="800" fill="#172033">Nanite Virtualized Geometry</text>
  <text x="70" y="140" font-size="18" fill="#657187">Nanite 是 UE5 的虚拟化微多边形几何系统。它把高精度网格离线拆分成 Cluster 层级，运行时按视锥、遮挡和屏幕误差只流送并光栅化可见细节，从而让影视级资产可以更直...</text>
    <rect x="58" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="133" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Import</text>
  <path d="M 216 269 L 236 269" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="246" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="321" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Cluster Build</text>
  <path d="M 404 269 L 424 269" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="434" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="509" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Page Store</text>
  <path d="M 592 269 L 612 269" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="622" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="697" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Cull + Select</text>
  <path d="M 780 269 L 800 269" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="810" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="885" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Rasterize</text>
  <path d="M 968 269 L 988 269" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="998" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="1073" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">GBuffer</text>
  <text x="70" y="410" font-size="18" fill="#657187">示意图：Nanite 的数据路径不是传统 Static Mesh 直接提交三角形，而是先构建层级 Cluster，再由运行时选择可见 Cluster。</text>
</svg>