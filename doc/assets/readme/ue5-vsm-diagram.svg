  <text x="70" y="100" font-size="34" font-weight="800" fill="#172033">Virtual Shadow Maps</text>
  <text x="70" y="140" font-size="18" fill="#657187">Virtual Shadow Maps（VSM）是 UE5 面向 Nanite 与大世界场景的高分辨率阴影系统。它把每个光源的阴影空间虚拟化为 16K 级别贴图，并以 128 ...</text>
    <rect x="58" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
