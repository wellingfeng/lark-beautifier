  <rect x="998" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1073" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Lighting</text>
  <text x="70" y="410" font-size="18" fill="#657187">示意图：VSM 把阴影贴图虚拟化为 page cache，摄像机和光源变化只更新需要的页面。</text>
