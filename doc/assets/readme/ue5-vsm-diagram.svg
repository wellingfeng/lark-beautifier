  <rect x="434" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="509" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Cache Check</text>
  <path d="M 592 269 L 612 269" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="622" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="697" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Render Missing</text>
  <path d="M 780 269 L 800 269" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="810" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
