  <text x="1073" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">GI + Reflections</text>
  <text x="70" y="410" font-size="18" fill="#657187">示意图：Lumen 会先使用屏幕空间信息，再回退到场景表示与 ray tracing 路径，最后合成间接光和反射。</text>
