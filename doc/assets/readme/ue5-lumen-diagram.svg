  <text x="70" y="100" font-size="34" font-weight="800" fill="#172033">Lumen GI &amp; Reflections</text>
  <text x="70" y="140" font-size="18" fill="#657187">Lumen 是 UE5 的动态全局光照与反射系统。它结合 Screen Traces、Surface Cache、软件/硬件 Ray Tracing 与 Final Gathe...</text>
    <rect x="58" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
