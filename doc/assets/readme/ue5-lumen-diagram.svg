  <path d="M 216 269 L 236 269" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="246" y="230" width="150" height="78" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
  <text x="321" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Screen Trace</text>
  <path d="M 404 269 L 424 269" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow)"/>
